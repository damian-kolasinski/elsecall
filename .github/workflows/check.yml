name: Check
# fmt, Clippy and the Rust tests (cargo test, doctests included), after a change
# lands on main and on a release's tag. Pull
# requests don't run it: whoever submits a change runs `mise run check` first
# (AGENTS.md), and a mistake that lands on main is cheap to fix forward. A
# release is not, so it calls this workflow on its tag and publishes only after
# it passed there. main-status.yml turns main's results into the main-red issue.
on:
  push:
    branches: [main]
  workflow_call:
concurrency:
  # main tests its newest commit: a run in progress finishes, and of the commits
  # that land meanwhile only the newest waits for it, so a busy day can't keep
  # cancelling runs before any finishes. A release's call is grouped under the
  # calling workflow and its tag, apart from main's runs and from the caller's
  # own group (group names ignore case, hence the `check-` prefix).
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
env:
  # Plain Cargo, not mbx's build cache: a runner starts with an empty one.
  MBX_DISABLE: "1"
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # mise.toml's tools: the toolchain, and the packslip CLI the release tests sign with.
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.10.11
          cache: false
          github_token: ${{ github.token }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - name: Lint and unit-test builds that follow a local release channel
        run: scripts/check-local-channel.sh
      - run: cargo test --workspace --locked
