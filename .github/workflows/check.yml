name: Check
# Once per commit: a pull request tests its revisions, and main tests each
# commit that lands there. Pushes of review branches and of tags would only
# test the same commits again.
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  # A newer revision of a pull request supersedes the run of the older one.
  # Every main commit keeps its own run, since any of them may be released.
  group: check-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # mise.toml's tools: the toolchain, and the packslip CLI the release tests sign with.
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.10.11
          cache: false
          github_token: ${{ github.token }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - name: Lint and unit-test builds that follow a local release channel
        run: scripts/check-local-channel.sh
      - run: cargo test --workspace --locked
