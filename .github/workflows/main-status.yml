# Keeps one issue labelled main-red open while Check fails on main, so a red
# main is visible to the operator and to every session starting work, and one
# of them takes the fix. A failure opens the issue or comments on it, a pass
# closes it, and a superseded (cancelled) run changes nothing. See
# scripts/main_status.py.
name: Main status
on:
  workflow_run:
    workflows: [Check]
    types: [completed]
    branches: [main]
permissions: {}
jobs:
  report:
    # Superseded runs end the job here, before they could take the queue's one
    # pending place from a run that has a result to report.
    if: >-
      github.event.workflow_run.event == 'push' &&
      !contains(fromJSON('["cancelled", "skipped", "neutral", "stale"]'), github.event.workflow_run.conclusion)
    concurrency:
      group: main-status
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      # The script comes from main, never from the run being reported.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Open, update or close the main-red issue
        env:
          GH_TOKEN: ${{ github.token }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: >-
          python3 scripts/main_status.py --repository "$GITHUB_REPOSITORY"
          --conclusion "$CONCLUSION" --url "$RUN_URL" --commit "$COMMIT"
