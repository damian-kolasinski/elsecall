name: Release

on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - distribution/**
      - mise.toml
      - Cargo.toml
      - Cargo.lock

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MISE_GITHUB_TOKEN: ${{ github.token }}

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: release
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python3 distribution/release_version.py --tag "$RELEASE_TAG" --output "$GITHUB_OUTPUT"
      - name: The release commit is on main
        if: github.ref_type == 'tag'
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  build:
    needs: version
    # Ship only the native target this job runs. Elsecall supports macOS.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.10.11
          cache: false
      - run: cargo test --workspace --locked
      - run: python3 -m unittest discover -s distribution -p 'test_*.py'
      - run: python3 distribution/package.py --build
      - run: python3 distribution/smoke.py dist/elsecall-*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: elsecall-aarch64-apple-darwin
          path: dist/elsecall-*.tar.gz
          if-no-files-found: error

  sign:
    needs: [version, build]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: elsecall-aarch64-apple-darwin
          path: dist
      - id: packslip
        uses: jdx/packslip@3a4afb16b29d3ac639fcd35cbe99124184f71859 # v1.11.1
        with:
          artifacts: dist/elsecall-*.tar.gz
          bin: elsecall
          tag: ${{ needs.version.outputs.tag }}
          version: ${{ needs.version.outputs.version }}
          commit: ${{ github.sha }}
          upload: false
          # A private repository without Enterprise can sign, but not attest.
          attest: ${{ github.event.repository.private && 'false' || 'true' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packslip
          path: ${{ steps.packslip.outputs.bundle }}
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: [version, sign]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Publish the archive and its signed bundle together
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "$RELEASE_TAG" \
            --prerelease="$RELEASE_PRERELEASE" \
            --notes "Signed Elsecall release. Install it through mise's packslip backend, then run elsecall install." \
            dist/elsecall-*.tar.gz dist/packslip.sigstore.json

  verify-published:
    needs: [version, publish]
    if: github.ref_type == 'tag'
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.10.11
          cache: false
      - name: Install the published release through mise and check it
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: python3 distribution/install.py --repository "$GITHUB_REPOSITORY" --version "$RELEASE_VERSION" --commit "$GITHUB_SHA"
