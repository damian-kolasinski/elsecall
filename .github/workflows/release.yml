name: Release

on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - distribution/**
      - mise.toml
      - Cargo.toml
      - Cargo.lock

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MISE_GITHUB_TOKEN: ${{ github.token }}
  # Plain Cargo, not mbx's build cache: a runner starts with an empty one.
  MBX_DISABLE: "1"

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: release
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python3 distribution/release_version.py --tag "$RELEASE_TAG" --output "$GITHUB_OUTPUT"
      - name: The release commit is on main
        if: github.ref_type == 'tag'
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  # Check runs the full test suite on every commit pushed to main. A release
  # waits for that run on the tagged commit instead of running the suite again;
  # nothing is signed or published until it passed.
  tested:
    needs: version
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    # Covers a Check run still queued for a macOS runner when the tag arrives.
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check passed on main for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 distribution/checked_commit.py --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --summary "$GITHUB_STEP_SUMMARY"

  # Packages, smoke-tests and installs the archive. A pull request's own Check
  # run tests it, and a tag waits for main's in the tested job.
  build:
    needs: version
    # Ship only the native target this job runs. Elsecall supports macOS.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.10.11
          cache: false
      - run: python3 -m unittest discover -s distribution -p 'test_*.py'
      - run: python3 distribution/package.py --build
      - run: python3 distribution/smoke.py dist/elsecall-*.tar.gz
      - name: Install the archive on this runner and open its window
        run: python3 distribution/desktop_install.py dist/elsecall-*.tar.gz
      - name: Write the installer set to this release
        run: python3 distribution/stamp_installer.py --output dist/install.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: elsecall-aarch64-apple-darwin
          path: |
            dist/elsecall-*.tar.gz
            dist/install.sh
          if-no-files-found: error

  sign:
    needs: [version, tested, build]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: elsecall-aarch64-apple-darwin
          path: dist
      - id: packslip
        uses: jdx/packslip@3a4afb16b29d3ac639fcd35cbe99124184f71859 # v1.11.1
        with:
          artifacts: dist/elsecall-*.tar.gz
          bin: elsecall elsecall-ui
          tag: ${{ needs.version.outputs.tag }}
          version: ${{ needs.version.outputs.version }}
          commit: ${{ github.sha }}
          upload: false
          # A private repository without Enterprise can sign, but not attest.
          attest: ${{ github.event.repository.private && 'false' || 'true' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packslip
          path: ${{ steps.packslip.outputs.bundle }}
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: [version, tested, sign]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Publish the archive, its signed bundle and the installer together
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "$RELEASE_TAG" \
            --prerelease="$RELEASE_PRERELEASE" \
            --notes "Signed Elsecall release. Install it and open its window on an Apple silicon Mac with: curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/latest/download/install.sh | sh" \
            dist/elsecall-*.tar.gz dist/packslip.sigstore.json dist/install.sh

  verify-published:
    needs: [version, publish]
    if: github.ref_type == 'tag'
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.10.11
          cache: false
      - name: Install the published release through mise and check it
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: python3 distribution/install.py --repository "$GITHUB_REPOSITORY" --version "$RELEASE_VERSION" --commit "$GITHUB_SHA"
      - name: Install with the published one-command installer and open the window
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/install.sh" -o "$RUNNER_TEMP/install.sh"
          python3 distribution/desktop_install.py --script "$RUNNER_TEMP/install.sh" --expect-version "$RELEASE_VERSION"
