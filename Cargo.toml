[dev-dependencies]
elsecall-contract = { workspace = true, features = ["test-support"] }

[profile.release]
lto = "thin"
strip = true

# Backtraces keep file and line; full debug info is opt-in (`--profile debugging`).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true

# Digests dominate sync time; keep them fast in test builds too.
[profile.dev.package.sha2]
opt-level = 3

# rune ea6ddf8f2c3cd476a3797caad7d77cbe04641d9c (2026-11-12).
