[workspace]
resolver = "3"
members = [".", "crates/*"]
# `mise run build` stays the service binary. The desktop crate is built by
# `--workspace` checks and `cargo run -p elsecall-ui`.
default-members = ["."]

# Every crate is one release: they share its version, which the binaries report.
[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

# One version and one feature set per dependency, for every crate, so building
# one crate never compiles a dependency differently from the whole workspace.
[workspace.dependencies]
axum = "0.8.9"
base64 = "0.22"
chacha20poly1305 = "0.10"
clap = { version = "4.6", features = ["derive"] }
ed25519-dalek = "2"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
getrandom = "0.3"
hkdf = "0.12"
http-body-util = "0.1"
humantime = "2.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "service"] }
libc = "0.2"
plist = "1.10"
png = "0.18"
# rune dev ea6ddf8f2c3cd476a3797caad7d77cbe04641d9c (2026-11-12).
# Bump: change these revs and the four patch revs below together.
rune = { git = "https://github.com/anomalyco/rune", rev = "ea6ddf8f2c3cd476a3797caad7d77cbe04641d9c" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "ea6ddf8f2c3cd476a3797caad7d77cbe04641d9c" }
rusqlite = { version = "0.40", features = ["bundled"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
# Replay re-scores recorded decisions, so floats must read back exactly.
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
sha2 = "0.10"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
# test-util is not only for tests: the simulator runs the real scheduler on a
# paused clock (`elsecall simulate`, `elsecall tune`).
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "net", "signal", "sync", "time", "test-util"] }
tempfile = "3"
toml = "1.1"
toml_edit = "0.25.19"
tower = { version = "0.5", features = ["util"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = "1"
# The workspace's own crates.
elsecall-add-mac = { path = "crates/elsecall-add-mac" }
elsecall-admission = { path = "crates/elsecall-admission" }
elsecall-agent-skill = { path = "crates/elsecall-agent-skill" }
elsecall-api-response = { path = "crates/elsecall-api-response" }
elsecall-config-sync = { path = "crates/elsecall-config-sync" }
elsecall-config-sync-model = { path = "crates/elsecall-config-sync-model" }
elsecall-contract = { path = "crates/elsecall-contract" }
elsecall-fleet = { path = "crates/elsecall-fleet" }
elsecall-fleet-upgrade = { path = "crates/elsecall-fleet-upgrade" }
elsecall-host = { path = "crates/elsecall-host" }
elsecall-housekeeping = { path = "crates/elsecall-housekeeping" }
elsecall-installation = { path = "crates/elsecall-installation" }
elsecall-load-log = { path = "crates/elsecall-load-log" }
elsecall-membership = { path = "crates/elsecall-membership" }
elsecall-openssh-mac = { path = "crates/elsecall-openssh-mac" }
elsecall-os-processes = { path = "crates/elsecall-os-processes" }
elsecall-outside-pressure = { path = "crates/elsecall-outside-pressure" }
elsecall-peer-diagnostics = { path = "crates/elsecall-peer-diagnostics" }
elsecall-peer-transport = { path = "crates/elsecall-peer-transport" }
elsecall-placement = { path = "crates/elsecall-placement" }
elsecall-platform-macos = { path = "crates/elsecall-platform-macos" }
elsecall-rehearsal = { path = "crates/elsecall-rehearsal" }
elsecall-release-update = { path = "crates/elsecall-release-update" }
elsecall-remote-run = { path = "crates/elsecall-remote-run" }
elsecall-replay = { path = "crates/elsecall-replay" }
elsecall-report-facts = { path = "crates/elsecall-report-facts" }
elsecall-reporting = { path = "crates/elsecall-reporting" }
elsecall-scheduling = { path = "crates/elsecall-scheduling" }
elsecall-secure-channel = { path = "crates/elsecall-secure-channel" }
elsecall-service-config = { path = "crates/elsecall-service-config" }
elsecall-service-lifecycle = { path = "crates/elsecall-service-lifecycle" }
elsecall-simulation = { path = "crates/elsecall-simulation" }
elsecall-tailnet = { path = "crates/elsecall-tailnet" }
elsecall-tools = { path = "crates/elsecall-tools" }
elsecall-trace = { path = "crates/elsecall-trace" }
elsecall-tuning = { path = "crates/elsecall-tuning" }
elsecall-window = { path = "crates/elsecall-window" }
elsecall-workload = { path = "crates/elsecall-workload" }
elsecall-workload-config = { path = "crates/elsecall-workload-config" }
elsecall-workspace = { path = "crates/elsecall-workspace" }

# Every crate inherits these with `[lints] workspace = true`.
[workspace.lints.rust]
# `pub` claims another crate uses the item; inside a crate, say `pub(crate)`.
unreachable_pub = "warn"

[package]
name = "elsecall"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Inspect and maintain your development machines"
license.workspace = true

[lints]
workspace = true

[lib]
# The library has no Rust doctests; skip rustdoc's pass over it.
doctest = false

[[bin]]
name = "elsecall"
path = "src/main.rs"
# main.rs has no unit tests; integration tests run the built binary.
test = false

[features]
# Follow a local release channel instead of the published releases, for testing
# the update path against local builds. scripts/local-release.sh builds with it;
# the release workflow never does. See crates/elsecall-release-update/src/release_update/channel.rs.
local-release-channel = ["elsecall-release-update/local-release-channel"]

[dependencies]
axum.workspace = true
base64.workspace = true
chacha20poly1305.workspace = true
clap.workspace = true
ed25519-dalek.workspace = true
elsecall-add-mac.workspace = true
elsecall-admission.workspace = true
elsecall-agent-skill.workspace = true
elsecall-api-response.workspace = true
elsecall-config-sync-model.workspace = true
elsecall-config-sync.workspace = true
elsecall-contract.workspace = true
elsecall-fleet-upgrade.workspace = true
elsecall-fleet.workspace = true
elsecall-host.workspace = true
elsecall-housekeeping.workspace = true
elsecall-installation.workspace = true
elsecall-load-log.workspace = true
elsecall-membership.workspace = true
elsecall-openssh-mac.workspace = true
elsecall-os-processes.workspace = true
