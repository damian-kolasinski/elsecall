elsecall-report-facts.workspace = true
elsecall-reporting.workspace = true
elsecall-scheduling.workspace = true
elsecall-secure-channel.workspace = true
elsecall-service-config.workspace = true
elsecall-service-lifecycle.workspace = true
elsecall-simulation.workspace = true
elsecall-tailnet.workspace = true
elsecall-tools.workspace = true
elsecall-trace.workspace = true
elsecall-tuning.workspace = true
elsecall-window.workspace = true
elsecall-workload-config.workspace = true
elsecall-workload.workspace = true
elsecall-workspace.workspace = true
futures-util.workspace = true
getrandom.workspace = true
hkdf.workspace = true
http-body-util.workspace = true
humantime.workspace = true
hyper.workspace = true
hyper-util.workspace = true
libc.workspace = true
plist.workspace = true
rusqlite.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
