# The workspace's crates and the band each sits in, held by scripts/crate_graph.py.
#
# Every crate is the package `elsecall-<name>` in `crates/elsecall-<name>/` and
# has an entry here; a new crate needs its entry, with its band, before it
# lands. Choose the band by what the crate may depend on, not by what depends
# on it.
#
# `modules` are the `elsecall` library modules each crate was moved out of, by
# their path from the library root (`scheduling` or `scheduling::timestamp`).
# For the entry crates `cli` and `service`, which stay in the `elsecall`
# package, they are its modules today. scripts/crate_split.py reads them to
# move code written against the single crate onto the crates.

# Lowest first. A crate may depend on crates in its own band or a lower one,
# never a higher one, and the planned crates may not form a cycle.
bands = ["foundation", "core", "feature", "lab", "adapter", "entry"]

[band.foundation]
# Shared vocabulary that everything builds on. A private edit here reruns rustc
# for every crate above, so these stay small and free of frameworks.
max_lines = 2500
forbid = ["axum", "hyper", "hyper_util", "http_body_util", "tower", "rusqlite", "clap", "sysinfo", "plist", "toml_edit"]

[band.core]
# Scheduling, the records it keeps and peer transport. No HTTP routes and no
# command line: the service mounts their routes and the binary their commands.
forbid = ["axum", "clap"]

[band.feature]
[band.lab]
[band.adapter]
# Platform adapters implement ports the slices declare. Only entry points,
# the one band above, may depend on them.
[band.entry]

# --- foundation ---------------------------------------------------------------

[crates.workload-config]
band = "feature"
modules = ["workload_settings", "workload_configuration", "workload_migration"]

[crates.admission]
band = "feature"
modules = ["admission_api", "admission_cli", "run_relay", "passthrough", "local_run_client"]

[crates.remote-run]
band = "feature"
modules = ["remote_run", "sealed_run"]

[crates.placement]
band = "feature"
modules = ["placement_api", "placement_authority", "placement_host", "placement_config_sync"]

[crates.service-config]
band = "feature"
modules = ["configuration"]

[crates.config-sync]
band = "feature"
modules = ["config_sync", "config_sync_api", "config_sync_cli", "config_sync_local_api", "service_configuration"]

[crates.tools]
band = "feature"
modules = ["toolset", "toolset_api", "tools_api", "tools_cli", "tool_inventory", "fleet_tool_inventory", "mise_cli", "macos::xcodes", "inventory_reader"]

[crates.workspace]
band = "feature"
modules = ["workspace"]

[crates.housekeeping]
band = "feature"
# Removing copies of other members' workspaces, asking their owners first over
# the fleet, and the routes that serve and trigger it.
modules = ["housekeeping", "fleet_callers", "fleet_copies", "copies_api", "copies_cli", "workspace_check_api"]

[crates.installation]
band = "feature"
# The installed files, the lock every lifecycle operation holds (and who holds
# it), the companion window staged beside the executable, and the ports through
# which other slices take part in an uninstall.
modules = ["installation", "lifecycle_holder", "window_release"]

[crates.window]
band = "feature"
modules = ["window_app", "window_startup", "install_window"]

[crates.release-update]
band = "feature"
modules = ["release_update", "release_update_api", "release_update_cli"]

[crates.fleet-upgrade]
band = "feature"
modules = ["fleet_upgrade", "fleet_upgrade_api", "fleet_upgrade_local_api", "upgrade_drain", "upgrade_helper_process"]

[crates.api-response]
band = "feature"
# The error envelope slices' HTTP routes answer with.
modules = ["api_response"]

[crates.agent-skill]
band = "feature"
modules = ["agent_skill"]

[crates.service-lifecycle]
band = "feature"
modules = ["service_handover", "service_relaunch"]

# --- lab slices ---------------------------------------------------------------

[crates.report-facts]
band = "lab"
# One request, its leftovers and a report's period, as reports and workload
# models read records.
modules = ["reporting::facts", "reporting::window", "reporting::leftovers", "report_protocol"]

[crates.reporting]
band = "lab"
# Reports and where their facts come from: this member's history, other
# members' over the peer channel, and the protocol between them.
modules = ["reporting", "report_api", "report_cli", "own_history", "peer_history"]

[crates.workload]
band = "lab"
# Workload traces and the empirical models built from recorded requests.
modules = ["workload"]

[crates.trace]
band = "lab"
modules = ["trace_api", "trace_cli", "trace_snapshot"]

[crates.replay]
band = "lab"
modules = ["replay_api", "replay_cli", "replay_placement"]

[crates.simulation]
band = "lab"
# The simulator, the trace input it reads and the arrival density it applies.
modules = ["simulation", "evaluation_day", "workload_input", "replay_load"]

[crates.rehearsal]
band = "lab"
modules = ["rehearsal", "rehearsal_api", "tuning_trust", "tuning_trust_api", "tuning_objective"]

[crates.tuning]
band = "lab"
modules = ["tuning", "tune_cli", "tuning_drift", "tuning_preflight", "tuning_preflight_cli", "busy_hour_calibration"]

# --- adapters -----------------------------------------------------------------

[crates.platform-macos]
band = "adapter"
modules = ["macos", "process_service"]

[crates.openssh-mac]
band = "adapter"
# Adding a Mac over Remote Login: the remote side of add-mac.
modules = ["openssh_mac"]

[crates.service]
band = "entry"
# Router assembly and the peer listener: they mount routes from many slices and
# apply enrolled-member authentication over all of them.
modules = ["server", "peer_api", "peer_listener", "outside_pressure_api", "ui_app"]

[crates.cli]
band = "entry"
# The `elsecall` binary, src/main.rs, and subcommands of slices that may not
# use clap themselves.
binary = "src/main.rs"
modules = ["workload_observation_cli", "state_sizes", "add_mac_cli", "nearby_cli", "fleet_cli", "uninstall", "simulate_cli", "rehearse_cli", "rehearsal_compare"]

[crates.ui]
band = "entry"
packages = ["elsecall-ui"]
# The desktop app talks to the service through its contract, never through the
# service's internals.
may_depend_on = ["contract", "host", "peers", "fleet", "release-update", "installation", "window", "workload-config"]

[crates.contract]
band = "foundation"
# The vocabulary every crate shares: failures, the wire forms and API envelope, guidance, labels, build identity, the scheduler's request model and this machine's facts.
modules = ["failure", "api", "wire", "guidance", "run_admission", "labels", "rehearsal::identity", "build_identity", "executable_format", "version_skew", "scheduling::request", "scheduling::settings", "scheduling::timestamp", "scheduling::capacity", "scheduling::gate", "scheduling::run_id", "scheduling::speed", "workload_metadata", "inspection", "idle_load"]

[crates.host]
band = "core"
# This machine's local plumbing: starting child processes, the state directory and its private files, SQLite retention, the service log, the client for the local service, and scripted machine observations for tests.
modules = ["child_start", "command_capture", "paths", "private_files", "local_access", "state_temps", "run_id_file", "sqlite_retention", "service_log", "client", "machine_script"]

[crates.peers]
band = "core"
# Talking to the other members: the tailnet, the secure channel between members, membership and its keys, peer transport and its diagnostics.
modules = ["tailnet", "tailscale_bottle", "secure_channel", "roster", "member_key", "member_code", "membership_store", "peer_auth", "peer_client", "peer_transport", "socket_io", "send_inactivity", "receive_inactivity", "peer_diagnostics"]

[crates.scheduling]
band = "core"
# Scheduling work on this member: admitting it, the records and estimates it learns from, the load log, outside pressure, and the operating system's processes it watches.
modules = ["scheduling", "load_log", "outside_pressure", "outside_pressure_gate", "macos::process_group", "macos::process_usage", "macos::processes"]

[crates.fleet]
band = "feature"
# The fleet: its members and their authority, adding a Mac to it, and the paths it may mirror between members.
modules = ["fleet", "fleet_changes", "fleet_local_api", "fleet_view", "fleet_placement", "add_mac", "nearby_macs", "remote_mac", "askpass", "authorized_keys", "inbound_firewall", "lan_address", "config_sync::synced_path", "config_sync::status"]
